[project]
name = "balandin-task-tracker"
version = "0.1.0"
description = "Этап 1: ORM и миграции АРМ учета производственных задач"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
